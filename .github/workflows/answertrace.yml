name: Update AnswerTrace widget

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  answertrace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: antonisloukis/answertrace@v1
        with:
          username: micode-ai
          # ANSWERTRACE_TOKEN is optional — the built-in GITHUB_TOKEN is used
          # unless a repository secret of that name exists.
          token: ${{ secrets.ANSWERTRACE_TOKEN || secrets.GITHUB_TOKEN }}
          output: assets/discussion-impact.svg
          accent: "#1f6feb"

      - name: Commit the widget if it changed
        shell: bash
        run: |
          if git diff --quiet -- assets/discussion-impact.svg; then
            echo "Widget unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/discussion-impact.svg
          git commit -m "chore: update AnswerTrace widget"
          git push
